<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Платформа агентов</title>
    <link rel="stylesheet" href="./styles.css?v=20260426-single-chat" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <h1>Платформа агентов</h1>
            <p>Рабочее место чата</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-title">Агенты</div>
          <div id="agentList" class="agent-list"></div>
        </section>
      </aside>

      <section class="chat">
        <header class="chat-header">
          <div>
            <h2>Чат с агентом</h2>
            <p id="statusText">Подключение к бэкенду...</p>
          </div>
          <button id="refreshButton" class="icon-button" title="Обновить">↻</button>
        </header>

        <div id="messages" class="messages"></div>

        <form id="chatForm" class="composer mention-composer">
          <div class="input-wrap">
            <input id="messageInput" type="text" placeholder="Введите @ для выбора агента или отправьте сообщение ассистенту..." autocomplete="off" />
            <div id="mentionMenu" class="mention-menu" hidden></div>
          </div>
          <button type="submit">Отправить</button>
        </form>
      </section>

      <aside class="inspector">
        <section class="panel">
          <div class="panel-title">Текущая задача</div>
          <div id="taskView" class="task-view">暂无任务</div>
        </section>

        <section class="panel events-panel">
          <div class="panel-title">Журнал событий</div>
          <div id="eventList" class="event-list"></div>
        </section>
      </aside>
    </main>

    <script src="./app.js?v=20260426-single-chat"></script>
  </body>
</html>
